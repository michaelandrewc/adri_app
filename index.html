<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#061b3a">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Miss' Toy">

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">

    <title>Miss' Toy</title>
</head>

<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>

    <main class="app app-loading" id="app">

        <header class="app-header">
            <h1 id="title">Loading...</h1>
            <p id="description"></p>
            <div class="header-accent"></div>
        </header>


    <!-- FIRST SHEET -->

     <article 
        class="info-card"
        data-title="Total Sends"
        data-description="This is how much money your slave has sent you so far. If you want more, just click the button!">


        <div class="card-content">
            <h2>Total Sends</h2>
            <p id="sheet-value">Loading...</p>
        </div>
       
        <div class="button-area">
            <!-- TOTAL SENDS BUTTON -->
            <button
                class="card-button signal-button"
                id="money-button"
                data-signal="get_money">
                Get Money
            </button>

        </div>

    </article>


    <!-- CURRENT MOOD -->

    <article 
        class="info-card"
        data-title="Current Arousal"
        data-description="This shows your slave's current mood - updated 3 times a day be default. Send an insult if he's feeling too good!">

        <div class="card-content">
            <h2>Current Mood</h2>

            <img
                id="mood-image"
                src=""
                alt="Current mood"
                class="mood-image"
            >
        </div>

        <div class="button-area">
            <!-- MOOD BUTTON -->
            <button
                class="card-button signal-button"
                id="insult-button"
                data-signal="insult">
                Insult
            </button>
        </div>

    </article>


    <!-- SECOND SHEET B2 -->

     <article 
        class="info-card"
        data-title="Current Arousal"
        data-description="This shows how turned on your slave is right now. 🙂 is the lowest and the more 🥵 the more aroused he is - tease him if he's not horny enough!">


        <div class="card-content">
            <h2>Current Arousal</h2>
            <p id="sheet-value-2">Loading...</p>
        </div>
        <div class="button-area">
            <!-- AROUSAL BUTTON -->
            <button
                class="card-button signal-button"
                id="tease-button"
                data-signal="tease">
                Tease
            </button>
        </div>
    </article>


    <!-- SECOND SHEET C2 -->

    <article 
        class="info-card"
        data-title="Is Slave Caged?"
        data-description="This shows whether your slave is currently caged or not. Lock him up or free him!">

        <div class="card-content">
            <h2>Is Slave Caged?</h2>
            <p id="sheet-value-c2">Loading...</p>
        </div>

          <div class="button-area">
            <!-- CAGED BUTTON -->
            <button
                class="card-button signal-button"
                id="cage-button"
                data-signal="cage">
                Cage Him
            </button>
        </div>

    </article>


    <!-- SECOND SHEET D2 -->

    <article
        class="info-card"
        data-title="Is Slave Busy?"
        data-description="This shows whether your slave is currently is busy with work on an appointment. Make him work or send him encouragement!"
    >
        <div class="card-content">
            <h2>Is Slave Busy?</h2>
            <p id="sheet-value-d2">Loading...</p>
        </div>

        <div class="button-area">
            <button
                class="card-button signal-button"
                id="task-button"
                data-signal="make_work"
            >
                Make Work
            </button>
        </div>
    </article>

    </main>

    <div id="info-modal" class="modal hidden">

    <div class="modal-backdrop"></div>

        <div class="modal-content">
            <button id="modal-close" class="modal-close">×</button>

            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
        </div>
    </div>
    <script src="app.js"></script>

</body>

</html>
