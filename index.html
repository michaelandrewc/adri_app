<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#061b3a">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">

    <title>My App</title>
</head>

<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>

    <main class="app app-loading" id="app">

        <header class="app-header">
            <h1 id="title">Loading...</h1>
            <p id="description"></p>
            <div class="header-accent"></div>
        </header>


    <!-- FIRST SHEET -->

    <article class="info-card">

        <div class="card-content">
            <h2>Total Sends</h2>
            <p id="sheet-value">Loading...</p>
        </div>
       
        <div class="button-area">
            <button class="card-button">
                Get Money
            </button>
        </div>

    </article>


    <!-- CURRENT MOOD -->

    <article class="info-card">


        <div class="card-content">
            <h2>Current Mood</h2>

            <img
                id="mood-image"
                src=""
                alt="Current mood"
                class="mood-image"
            >
        </div>

        <div class="button-area">
            <button class="card-button">
                Insult
            </button>
        </div>

    </article>


    <!-- SECOND SHEET B2 -->

    <article class="info-card">

        <div class="card-content">
            <h2>Current Arousal</h2>
            <p id="sheet-value-2">Loading...</p>
        </div>
        <div class="button-area">
            <button class="card-button">
                Tease
            </button>
        </div>
    </article>


    <!-- SECOND SHEET C2 -->

    <article class="info-card">

        <div class="card-content">
            <h2>Is Slave Caged?</h2>
            <p id="sheet-value-c2">Loading...</p>
        </div>

          <div class="button-area">
            <button class="card-button">
                Cage Him
            </button>
        </div>

    </article>


    <!-- SECOND SHEET D2 -->

    <article class="info-card">

        <div class="card-content">
            <h2>Is Slave Busy?</h2>
            <p id="sheet-value-d2">Loading...</p>
        </div>

        <div class="button-area">
            <button class="card-button">
                Give Task
            </button>
        </div>

    </article>

    <script src="app.js"></script>

</body>

</html>
